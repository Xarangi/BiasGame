[project]
name = "biasgame"
version = "0.1.0"
description = "Counterfactual, trajectory-level measurement of social bias in LLM agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["biasgame*"]
